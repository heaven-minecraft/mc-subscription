<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heaven Minecraft Server</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <h1>Heaven Minecraft</h1>
      <p>优质 Minecraft 游戏体验</p>
    </header>

    <!-- 未登录 -->
    <div id="login-view" class="card">
      <h2>登录以订阅</h2>
      <p class="subtitle">我们仅获取您的邮箱。需年满 13 岁并同意<a href="/terms.html" target="_blank">服务条款</a>和<a href="/privacy.html" target="_blank">隐私政策</a>。</p>
      <label class="check-box">
        <input type="checkbox" id="agree-check">
        <span>我已年满 13 岁并同意条款</span>
      </label>
      <button id="btn-login" class="btn primary" disabled>使用 Google 登录</button>
    </div>

    <!-- 已登录 -->
    <div id="main-view" class="hidden">
      <div class="card user-card">
        <div>
          <p class="label">当前账号</p>
          <p id="user-email" class="email"></p>
        </div>
        <button id="btn-logout" class="btn ghost">退出</button>
      </div>

      <div class="card">
        <h2>服务器列表</h2>
        <div class="server-item">
          <div>
            <h3>生存服 (Survival)</h3>
            <p class="subtitle">版本 1.21.11 · 需白名单</p>
          </div>
          <button class="btn primary btn-subscribe">订阅 RM10/月</button>
        </div>
      </div>

      <div class="card">
        <h2>绑定游戏 ID</h2>
        <p class="subtitle">订阅前请填写您的 Minecraft ID。</p>
        <div class="input-group">
          <input type="text" id="mc-id-input" placeholder="例如: Steve">
          <button id="btn-save-id" class="btn secondary">保存</button>
        </div>
        <p id="msg" class="msg hidden"></p>
      </div>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
